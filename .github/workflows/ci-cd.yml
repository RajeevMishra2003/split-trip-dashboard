name: Salesforce LWC + Apex CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "force-app/main/default/lwc/**"
      - "force-app/main/default/classes/**"

  pull_request:
    branches:
      - main
    paths:
      - "force-app/main/default/lwc/**"
      - "force-app/main/default/classes/**"

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # =====================================================
      # 1. Checkout Repository
      # =====================================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # =====================================================
      # 2. Setup Node.js (v22 - required for latest Salesforce CLI)
      # =====================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # =====================================================
      # 3. Install Salesforce CLI
      # =====================================================
      - name: Install Salesforce CLI
        run: |
          npm install --global @salesforce/cli@latest

      # =====================================================
      # 4. Verify Salesforce CLI
      # =====================================================
      - name: Verify Salesforce CLI
        run: |
          node --version
          npm --version
          sf --version

      # =====================================================
      # 5. Create JWT Private Key
      # =====================================================
      - name: Create JWT Key
        run: |
          printf '%s\n' '${{ secrets.SF_JWT_KEY }}' > server.key
          chmod 600 server.key

      # =====================================================
      # 6. Authenticate Salesforce using JWT
      # =====================================================
      - name: Authenticate Salesforce
        run: |
          sf org login jwt \
            --client-id "${{ secrets.SF_CONSUMER_KEY }}" \
            --jwt-key-file server.key \
            --username "${{ secrets.SF_USERNAME }}" \
            --instance-url "https://login.salesforce.com" \
            --alias MyDevOrg

      # =====================================================
      # 7. Verify Salesforce Authentication
      # =====================================================
      - name: Verify Salesforce Org
        run: |
          sf org display --target-org MyDevOrg

      #
